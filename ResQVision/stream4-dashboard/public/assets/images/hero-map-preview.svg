<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="#E8ECE4">
  <rect width="600" height="400" fill="#E8ECE4"/>
  <!-- Simplified India Geo Outline Shape -->
  <path d="M220 80 L320 80 L350 120 L380 130 L420 150 L480 160 L450 200 L400 210 L370 240 L340 320 L300 380 L270 340 L260 260 L220 220 L200 180 L200 130 Z" fill="#DCE2D6" stroke="#C5CDC0" stroke-width="2"/>
  <!-- Coastlines & Rivers -->
  <path d="M220 220 Q260 240 300 380" fill="none" stroke="#B8C4B0" stroke-width="2"/>
  <path d="M350 120 Q320 200 370 240" fill="none" stroke="#B8C4B0" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Active Markers -->
  <!-- Hyderabad -->
  <circle cx="280" cy="270" r="14" fill="#D64B45" opacity="0.2"/>
  <circle cx="280" cy="270" r="6" fill="#D64B45"/>
  <text x="295" y="274" font-family="sans-serif" font-size="11" font-weight="bold" fill="#252923">Hyderabad (Flood Watch)</text>

  <!-- Visakhapatnam -->
  <circle cx="340" cy="255" r="14" fill="#D64B45" opacity="0.2"/>
  <circle cx="340" cy="255" r="6" fill="#D64B45"/>
  <text x="355" y="259" font-family="sans-serif" font-size="11" font-weight="bold" fill="#252923">Vizag (Cyclone Guba)</text>

  <!-- Mumbai -->
  <circle cx="230" cy="240" r="14" fill="#D89B3C" opacity="0.2"/>
  <circle cx="230" cy="240" r="6" fill="#D89B3C"/>
  <text x="145" y="244" font-family="sans-serif" font-size="11" font-weight="bold" fill="#252923">Mumbai (High Tide)</text>

  <!-- Chennai -->
  <circle cx="310" cy="330" r="10" fill="#637B59" opacity="0.3"/>
  <circle cx="310" cy="330" r="5" fill="#637B59"/>
  <text x="325" y="334" font-family="sans-serif" font-size="11" font-weight="bold" fill="#252923">Chennai (Relief Grid)</text>
</svg>
